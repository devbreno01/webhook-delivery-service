version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_webhook
    restart: always
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  
volumes:
  pgdata:
